# One artwork. Conditions: always, owner, admin, owner-or-admin.
title: "Artwork {title}"
rows: 6

items:
  back:
    slot: 0
    material: MAGENTA_GLAZED_TERRACOTTA
    display_name: "&c&l<"
    lore:
      - "&7Back to artworks"
    item_model: ""
    custom_model_data: 0
    action: back
  preview:
    slot: 1
    material: FILLED_MAP
    name: "{title}"
    lore:
      - "&7by {artist}"
      - "&aClick to View"
    condition: always
  delete:
    slot: 2
    material: REDSTONE
    display_name: "§cDelete"
    lore:
      - "§cClicking this will delete every copy of the artwork in the world!"
    condition: owner-or-admin
  rename:
    slot: 3
    material: WRITABLE_BOOK
    display_name: "§aRename"
    lore:
      - "§aClick to Rename"
    condition: owner-or-admin
