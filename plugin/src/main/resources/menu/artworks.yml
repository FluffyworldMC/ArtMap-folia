# Artwork list for one artist.
title: "{artist}'s Art"
rows: 6
parent: artists

items:
  back:
    slot: 45
    material: MAGENTA_GLAZED_TERRACOTTA
    display_name: "&c&l<"
    lore:
      - "&7Back to artists"
    item_model: ""
    custom_model_data: 0
    action: back
  sort:
    slot: 49
    material: HOPPER
    display_name: "&eSort: {sort_name}"
    lore:
      - "&7Click to cycle sort mode"
      - "&8Mode {sort_index}/{sort_count}"
      - "&8Next: {sort_next}"
    item_model: ""
    custom_model_data: 0
    action: sort

list:
  start-slot: 1
  page-size: 25
  previous-slot: 0
  next-slot: 26
  sort:
    default: title
    modes:
      title: "Title A-Z"
      title-desc: "Title Z-A"
      newest: "Newest First"
      oldest: "Oldest First"
  item:
    material: FILLED_MAP
    name: "{title}"
    lore:
      - "&7by {artist}"
      - "&aClick to View"
  overrides: {}
