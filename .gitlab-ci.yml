stages:
  - generate-release
  - sast
  - build
  - integration
  - coverage
  - publish
  - release

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        NEXT_VERSION: '$CI_COMMIT_TAG'
    - variables:
        NEXT_VERSION: '$CI_COMMIT_SHORT_SHA'

variables:
  # This will suppress any download for dependencies and plugins or upload messages which would clutter the console log.
  # `showDateTime` will show the passed time in milliseconds. You need to specify `--batch-mode` to make this work.
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  # Maven 3.3+ could take these from .mvn/maven.config; installAtEnd/deployAtEnd need recent plugin versions.
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true"

# Cache downloaded dependencies and plugins between builds.
# To keep cache across branches add 'key: "$CI_JOB_NAME"'
cache:
  paths:
    - .m2/repository

# ===== Build =====

# 1.18
.jdk17:
  image: maven:3.9-eclipse-temurin-17
  variables:
    MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true -DskipTests -Dmaven.test.skip=true"

# 1.20.5+
.jdk21:
  image: maven:3.9-eclipse-temurin-21

#use maven verify we don't need to pollute the cache with the build artifacts
.build:
  stage: build
  script:
    - mvn versions::set -DnewVersion=${NEXT_VERSION}
    - mvn versions::commit
    - 'mvn $MAVEN_CLI_OPTS verify'
  artifacts:
    paths:
      - plugin/target/*.jar                             #Grab the built jars
      - plugin/target/jacoco.exec                       # unit-test execution data, merged with integration's later
      - plugin/target/site/jacoco/jacoco.xml
    reports:
      junit:
        - plugin/target/surefire-reports/TEST-*.xml
        - plugin/target/failsafe-reports/TEST-*.xml

build:jdk17:
  interruptible: true
  extends: [.jdk17, .build]

build:jdk21:
  interruptible: true
  extends: [.jdk21, .build]
  script:
    - mvn versions::set -DnewVersion=${NEXT_VERSION}
    - mvn versions::commit
    - 'mvn $MAVEN_CLI_OPTS verify'
    # Instrumented twin of the jar (ArtMap-<v>-it.jar) for the integration job's coverage. The profile restores
    # the compiled classes afterwards, so the plain jar above is untouched and stays the one released.
    - 'mvn $MAVEN_CLI_OPTS -pl plugin -am -P it-coverage -DskipTests package'

# ===== Coverage ===== unit (build:jdk21) and integration (integration) execution data merged into one report.

# report-aggregate picks up every *.exec under plugin/target, so dropping the integration file there merges it.
# The classes are recompiled here with the same JDK image, which keeps JaCoCo's class ids identical.
coverage:report:
  interruptible: true
  stage: coverage
  extends: .jdk21
  needs: ["build:jdk21", "integration"]
  script:
    - cp integration/jacoco-it.exec plugin/target/jacoco-it.exec
    - 'mvn $MAVEN_CLI_OPTS -pl plugin -am -DskipTests test'
  artifacts:
    paths:
      - plugin/target/site/jacoco/

coverage:
  interruptible: true
  stage: coverage
  image: registry.gitlab.com/haynes/jacoco2cobertura:1.0.11
  script:
    # Convert the merged JaCoCo report (plugin + api classes) to Cobertura; one source root per module.
    - python /opt/cover2cover.py plugin/target/site/jacoco/jacoco.xml $CI_PROJECT_DIR/plugin/src/main/java/ $CI_PROJECT_DIR/api/src/main/java/ > plugin/target/site/cobertura.xml
  needs: ["coverage:report"]
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: plugin/target/site/cobertura.xml

# ===== Publish =====

.publish:
  stage: publish
  # Pin the image: without one the job lands on the runner's default
  # alpine:latest, whose busybox has no curl (job failed with exit 127).
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - 'curl --fail --show-error --silent --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file plugin/target/ArtMap-${NEXT_VERSION}.jar "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ArtMap/${NEXT_VERSION}/ArtMap-${JDK}-${NEXT_VERSION}.jar"'
  rules:
    - if: '$CI_COMMIT_TAG'

publish:jdk17:
  interruptible: false
  extends: .publish
  needs: ["build:jdk17"]
  variables:
    JDK: "JDK17"

publish:jdk21:
  interruptible: false
  extends: .publish
  needs: ["build:jdk21"]
  variables:
    JDK: "JDK21"

# ===== Integration ===== bake-server-image pre-patches the Mojang jar (reused while MC_VERSION is unchanged);
# integration boots one server with the instrumented jar and runs every phase on every pipeline: the load
# check, the paint bot, the #376/#377 regression guards and the feature suite, then collects coverage
# (integration/README.md).

# Shared MC version + registry ref for the baked image (tagged by MC_VERSION; keep in sync with the integration jobs).
.integration-vars:
  variables:
    # Latest Paper the mineflayer bots can speak: 26.2 (protocol 776) and 26.3 (777) are ahead of minecraft-protocol.
    MC_VERSION: "26.1.2"
    BAKED_IMAGE: "${CI_REGISTRY_IMAGE}/paper-baked:${MC_VERSION}"

# Build and push the pre-baked image with Kaniko, not dind: the ~56MB Mojang download hangs through the nested dind
# network. Runs only when the image definition changes; bump it or MC_VERSION to force a rebuild.
bake-server-image:
  interruptible: false
  extends: .integration-vars
  stage: integration
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug
    entrypoint: [""]
  needs: []
  rules:
    - changes:
        - integration/server-image/**/*
        - .gitlab-ci.yml
    # Always allow a manual run (e.g. to seed the registry the first time, or
    # after the image is garbage-collected).
    - when: manual
      allow_failure: true
  script:
    # Kaniko reads registry credentials from /kaniko/.docker/config.json.
    - |
      AUTH=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | /busybox/base64 | tr -d '\n')
      mkdir -p /kaniko/.docker
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$CI_REGISTRY" "$AUTH" > /kaniko/.docker/config.json
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}/integration/server-image"
        --dockerfile "${CI_PROJECT_DIR}/integration/server-image/Dockerfile"
        --build-arg "MC_VERSION=${MC_VERSION}"
        --destination "$BAKED_IMAGE"
        --cache=true
        --cache-repo "${CI_REGISTRY_IMAGE}/paper-baked-cache"

integration:
  interruptible: true
  extends: .integration-vars
  stage: integration
  image: docker:latest
  # docker:dind provides the Docker daemon.  TLS is disabled so the Docker CLI
  # in the outer container can reach it without certificate setup.
  services:
    - name: docker:dind
      command: ["--tls=false"]
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
    # Use the pre-baked server image so the runtime boot skips the Mojang jar
    # download. ProtocolLib version can be overridden in project variables.
    SERVER_IMAGE: "${BAKED_IMAGE}"
    PROTOCOLLIB_VERSION: "dev-build"
    TIMEOUT: "600"
    # All phases, every pipeline: the self-hosted runner makes a full run cheap enough not to gate.
    RUN_PAINT_TEST: "true"
    RUN_REGRESSION_TEST: "true"
    RUN_FEATURE_TEST: "true"
  # optional: the bake only runs when the image definition changes, so integration must still run without it.
  needs:
    - "build:jdk21"
    - job: "bake-server-image"
      optional: true
  before_script:
    # The dind service needs a moment to start.  Poll until the daemon answers.
    - until docker info >/dev/null 2>&1; do echo "Waiting for Docker daemon..."; sleep 2; done
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # Invoke with sh explicitly: the docker:latest image is Alpine and has no bash.
    - sh integration/run-integration-test.sh
  artifacts:
    # Always upload the server log and the painted database so failed runs can be diagnosed; the exec file feeds
    # coverage:report.
    when: always
    paths:
      - integration/server.log
      - integration/Art.db
      - integration/jacoco-it.exec
    expire_in: 1 week

# ===== Release =====

# Creates the GitLab Release and attaches the two published JARs as package
# assets.  Runs only on tags, after both publish jobs have succeeded.
release:gitlab-release:
  interruptible: false
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["publish:jdk17", "publish:jdk21"]
  variables:
    # Full history is required so we can walk back to the previous tag.
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git
  script:
    # Previous tag, version-sorted. awk reads to EOF so nothing upstream gets SIGPIPE'd under pipefail.
    - PREV_TAG=$(git tag --sort=-version:refname | awk -v t="${CI_COMMIT_TAG}" '!found && $0 != t { print; found=1 }')
    # Build the commit range: either since the last tag, or the whole history.
    - |
      if [ -n "$PREV_TAG" ]; then
        echo "## Changes since ${PREV_TAG}" > release_notes.md
        RANGE="${PREV_TAG}..${CI_COMMIT_TAG}"
      else
        echo "## Changes" > release_notes.md
        RANGE="${CI_COMMIT_TAG}"
      fi
    # List commits, skipping merge commits and the automated release bumps.
    - git log --pretty=format:"- %s" --no-merges --invert-grep --grep="chore(release)" $RANGE >> release_notes.md
    - printf '\n' >> release_notes.md
    - cat release_notes.md
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'ArtMap $CI_COMMIT_TAG'
    description: './release_notes.md'
    assets:
      links:
        - name: 'ArtMap-JDK17-${NEXT_VERSION}.jar  (Minecraft 1.18–1.20.4, Java 17)'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ArtMap/${NEXT_VERSION}/ArtMap-JDK17-${NEXT_VERSION}.jar'
          link_type: package
        - name: 'ArtMap-JDK21-${NEXT_VERSION}.jar  (Minecraft 1.20.5+, Java 21)'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ArtMap/${NEXT_VERSION}/ArtMap-JDK21-${NEXT_VERSION}.jar'
          link_type: package
  rules:
    - if: '$CI_COMMIT_TAG'

# Updates POM versions to keep them in line with the release tag.
# Only pushes if there are changes.
release:maven-release:
  interruptible: false
  extends: .jdk21
  stage: release
  needs: ["publish:jdk21"]
  variables:
    COMMIT_MESSAGE: "chore(release): [skip ci] Release ${NEXT_VERSION}"
  before_script:
    # Push with the job token (a stored GITLAB_TOKEN kept expiring). Needs Settings > CI/CD > Job token
    # permissions > "Allow Git push requests to the repository".
    - git remote set-url origin https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_FQDN}/${CI_PROJECT_PATH}.git
    - git config --global user.email "${GITLAB_USER_EMAIL}"
    - git config --global user.name "${GITLAB_USER_ID}"
  script:
    - git checkout master
    - mvn versions::set -DnewVersion=${NEXT_VERSION}
    - mvn versions::commit
    - git add .
    - |-
      CHANGES=$(git status --porcelain | wc -l)
      if [ "$CHANGES" -gt "0" ]; then
        git status
        git commit -m "${COMMIT_MESSAGE}"
        git push
      fi
  rules:
    - if: '$CI_COMMIT_TAG'